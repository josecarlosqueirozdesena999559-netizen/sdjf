name: JuntoApp
options:
  bundleIdPrefix: com.achou
  deploymentTarget:
    iOS: "17.0"
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    from: "11.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3YB4FZDQ82
targets:
  JuntoApp:
    type: application
    platform: iOS
    sources:
      - path: TrilhaGO
      - path: Resources
        excludes:
          - "Info.plist"
    dependencies:
      - package: MapboxMaps
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "TrilhaGO"
        CFBundleName: "TrilhaGO"
        CFBundleDevelopmentRegion: "pt-BR"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        MBXAccessToken: "$(MBX_ACCESS_TOKEN)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "O TrilhaGO usa sua localização para mostrar territórios hexagonais, lojas próximas e registrar caminhadas e corridas."
        NSLocationAlwaysAndWhenInUseUsageDescription: "O TrilhaGO registra seu percurso em modo esporte para pontuar territórios e liberar chaves."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achou.com
        CURRENT_PROJECT_VERSION: 171
        MARKETING_VERSION: "1.0.40"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets: []
