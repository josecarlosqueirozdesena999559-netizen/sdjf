name: JuntoApp
options:
  bundleIdPrefix: com.achou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3YB4FZDQ82
targets:
  JuntoApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Components
      - path: DesignSystem
      - path: Services
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Juntô"
        CFBundleName: "Juntô"
        CFBundleDevelopmentRegion: "pt-BR"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "O Juntô utiliza a câmera para tirar fotos no chat e escanear comandas e notas fiscais."
        NSPhotoLibraryUsageDescription: "O Juntô acessa sua biblioteca de fotos para escolher a foto do perfil e capas dos seus rolês."
        NSMicrophoneUsageDescription: "O Juntô utiliza o microfone para gravar e enviar mensagens de áudio no chat com seus amigos."
        NSLocationWhenInUseUsageDescription: "O Juntô utiliza sua localização aproximada para exibir pessoas e grupos públicos próximos na sua região."
        NSContactsUsageDescription: "O Juntô acessa sua agenda de contatos para exibir seus contatos e permitir iniciar conversas rapidamente, como no WhatsApp."
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - Inter-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achou.com
        CURRENT_PROJECT_VERSION: 155
        MARKETING_VERSION: "1.0.24"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets: []
