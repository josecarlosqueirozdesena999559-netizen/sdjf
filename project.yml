name: ProjetoRelacionamento
options:
  bundleIdPrefix: com.achou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3YB4FZDQ82
targets:
  ProjetoRelacionamento:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Components
      - path: Services
      - path: Resources
        excludes:
          - "Info.plist"
      - path: Utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achou.com
        CURRENT_PROJECT_VERSION: 122
        MARKETING_VERSION: "1.0.17"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Usamos sua localização durante o uso do aplicativo para encontrar pessoas próximas, calcular a distância aproximada e melhorar suas recomendações."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Precisamos acessar suas fotos para que você possa escolher imagens para o seu perfil."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Precisamos do microfone para gravar mensagens de áudio de visualização única no chat."
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets: []
