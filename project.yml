name: MercadoFacil
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.2.0
options:
  bundleIdPrefix: com.mercadofacil
targets:
  MercadoFacil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Components
      - path: Services
      - path: Utilities
      - path: MercadoFacilApp.swift
      - path: Assets.xcassets
    dependencies:
      - package: Supabase
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Precisamos da sua localização para exibir produtos na sua região."
        CFBundleDevelopmentRegion: "pt-BR"
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations:
          - "pt-BR"

    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      ENABLE_PREVIEWS: NO
      OTHER_SWIFT_FLAGS: $(inherited) -enable-experimental-feature AccessLevelOnImport




