name: MercadoFacil
options:
  bundleIdPrefix: com.mercadofacil
targets:
  MercadoFacil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Components
      - path: Services
      - path: Utilities
      - path: MercadoFacilApp.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Precisamos da sua localização para exibir produtos na sua região."

    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      ENABLE_PREVIEWS: NO
