name: MercadoFacil
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.2.0
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-iOS-SDK.git
    from: 5.2.0
options:
  bundleIdPrefix: com.achou.com
targets:
  MercadoFacil:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Components
      - path: Services
      - path: Utilities
      - path: MercadoFacilApp.swift
      - path: Assets.xcassets
      - path: Fonts
        buildPhase: resources
    dependencies:
      - package: Supabase
      - package: OneSignal
        product: OneSignalFramework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achou.com
        DEVELOPMENT_TEAM: 3YB4FZDQ82
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CURRENT_PROJECT_VERSION: 61
        MARKETING_VERSION: 1.0.3
    entitlements:
      path: MercadoFacil.entitlements
      properties:
        aps-environment: production
    info:
      path: Info.plist
      properties:
        CFBundleVersion: "61"
        CFBundleShortVersionString: "1.0.3"
        UILaunchScreen: {}
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        NSMicrophoneUsageDescription: "Precisamos do microfone para gravar mensagens de voz."
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Precisamos da sua localizaÃ§Ã£o para exibir produtos na sua regiÃ£o."
        CFBundleDevelopmentRegion: "pt-BR"
        CFBundleAllowMixedLocalizations: true
        CFBundleLocalizations:
          - "pt-BR"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
