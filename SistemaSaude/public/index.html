<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Saúde</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Overlay "Aguarde..." -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <span>Aguarde...</span>
    </div>
  </div>

  <!-- TELA DE LOGIN -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-brand">
        <h1>Agenda <span>Saúde</span></h1>
        <p>Sistema Municipal de Gestão em Saúde</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="field-group">
          <label for="loginUser">Usuário</label>
          <input id="loginUser" type="text" value="admin" required autocomplete="username" />
        </div>
        <div class="field-group">
          <label for="loginPass">Senha</label>
          <input id="loginPass" type="password" value="admin123" required autocomplete="current-password" />
        </div>
        <div id="loginError" class="login-error hidden"></div>
        <button type="submit" class="btn-login">Acessar</button>
      </form>

      <div class="login-footer">
        <small>Acesso via Administrador</small>
        <small>Agenda Saúde — v1.0.0</small>
      </div>
    </div>

    <!-- Modal Seleção de Unidade -->
    <div id="unitModal" class="modal-backdrop hidden">
      <div class="modal-window">
        <div class="modal-header">
          <span>Seleção de Unidade de Saúde / Local de Armazenamento</span>
          <button type="button" id="btnCancelUnitX" class="modal-close" title="Fechar">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-field-row">
            <label for="selectUnit">Un. Saúde:</label>
            <select id="selectUnit"></select>
          </div>
          <div class="modal-field-row">
            <label for="inputLocalArm">Local Arm.:</label>
            <input id="inputLocalArm" type="text" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="btnConfirmUnit" class="btn-confirm">&#10003; Confirmar</button>
          <button type="button" id="btnCancelUnit" class="btn-cancel-modal">&#10007; Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SHELL PRINCIPAL -->
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-appname">AGENDA SAÚDE</span>
        <span class="topbar-divider"></span>
        <span id="topbarContext" class="topbar-context">Geral</span>
      </div>
      <div class="topbar-right">
        <span id="topbarUser" class="topbar-user"></span>
        <button id="btnLogout" class="btn-logout" title="Sair do sistema">Sair</button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span>Navegação</span>
          <button id="btnToggleSidebar" class="sidebar-collapse" title="Recolher">&#9664;</button>
        </div>
        <div class="sidebar-search">
          <input id="menuSearch" type="text" placeholder="Pesquise o programa desejado..." />
        </div>
        <nav id="folderTree" class="folder-tree"></nav>
      </aside>

      <main class="main-area">
        <div id="tabsBar" class="tabs-bar"></div>
        <div id="tabsContent" class="tabs-content"></div>
      </main>
    </div>

    <footer class="statusbar">
      <div class="status-left">
        <span>Agenda Saúde v1.0.0</span>
        <span class="sep">|</span>
        <span id="statusDateTime"></span>
      </div>
      <div class="status-center">
        <span id="statusUser">Usuário: -</span>
      </div>
      <div class="status-right">
        <span id="statusUnit">Unidade: -</span>
      </div>
    </footer>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/app.js"></script>
</body>
</html>
