name: Deploy to TestFlight

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Setup Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Fastlane Produce & Sigh (Auto Create App and Profile)
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPSTORE_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          
          mkdir -p fastlane
          cat <<EOF > fastlane/Fastfile
          default_platform(:ios)
          platform :ios do
            lane :setup_app do
              app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_filepath: "#{ENV['HOME']}/.appstoreconnect/private_keys/AuthKey_#{ENV['APPSTORE_KEY_ID']}.p8",
                in_house: false
              )
              
              produce(
                app_identifier: "com.seuuusario.mercadofacil",
                app_name: "MercadoFacil JCSena",
                language: "pt-BR",
                sku: "mercadofaciljcsena"
              )
              
              get_provisioning_profile(
                app_identifier: "com.seuuusario.mercadofacil",
                provisioning_name: "MercadoFacil Auto Profile",
                force: true,
                platform: "ios"
              )
            end
          end
          EOF
          fastlane ios setup_app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project MercadoFacil.xcodeproj \
            -scheme MercadoFacil \
            -archivePath $RUNNER_TEMP/MercadoFacil.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            PRODUCT_BUNDLE_IDENTIFIER=com.jcsena.mercadofacil2026 \
            PROVISIONING_PROFILE_SPECIFIER="MercadoFacil Auto Profile" \
            DEVELOPMENT_TEAM=3YB4FZDQ82 \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>3YB4FZDQ82</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jcsena.mercadofacil2026</key>
                  <string>MercadoFacil Auto Profile</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MercadoFacil.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MercadoFacil-IPA
          path: $RUNNER_TEMP/export/MercadoFacil.ipa

      - name: Upload to TestFlight via Fastlane
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p fastlane
          cat <<EOF > fastlane/Fastfile
          default_platform(:ios)
          platform :ios do
            lane :upload_testflight do
              app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_filepath: "#{ENV['HOME']}/.appstoreconnect/private_keys/AuthKey_#{ENV['APPSTORE_KEY_ID']}.p8",
                in_house: false
              )
              pilot(
                ipa: "$RUNNER_TEMP/export/MercadoFacil.ipa",
                skip_waiting_for_build_processing: true,
                skip_submission: true,
                app_identifier: "com.seuuusario.mercadofacil"
              )
            end
          end
          EOF
          fastlane ios upload_testflight 






