name: Build for Appetize.io

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate
        
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project MercadoFacil.xcodeproj \
            -scheme MercadoFacil \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
            
      - name: Zip the .app for Appetize
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "MercadoFacil.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App not found"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          mkdir -p build/simulator
          cp -R "$APP_PATH" build/simulator/
          cd build/simulator
          zip -r MercadoFacil_Simulator.zip MercadoFacil.app
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MercadoFacil_Appetize
          path: build/simulator/MercadoFacil_Simulator.zip