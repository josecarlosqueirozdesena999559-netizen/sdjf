workflows:
  ios-appetize-preview:
    name: Appetize.io Preview (TrilhaGO - Simulador iOS)
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      vars:
        XCODE_PROJECT: "JuntoApp.xcodeproj"
        XCODE_SCHEME: "JuntoApp"
      xcode: latest

    scripts:
      - name: Configure Mapbox Downloads (.netrc se MAPBOX_DOWNLOADS_TOKEN estiver definido)
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            cat <<EOF > ~/.netrc
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
            chmod 600 ~/.netrc
          fi

      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build iOS Simulator .app for Appetize.io
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .zip for Appetize.io
        script: |
          mkdir -p build/appetize
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found Simulator app: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/build/appetize/TrilhaGO-Simulator.zip" "$(basename "$APP_PATH")"

    artifacts:
      - build/appetize/TrilhaGO-Simulator.zip
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: TestFlight iOS - TrilhaGO (com.achou.com)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagicfds"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.achou.com
      vars:
        XCODE_PROJECT: "JuntoApp.xcodeproj"
        XCODE_SCHEME: "JuntoApp"
      xcode: latest

    scripts:
      - name: Configure Mapbox Downloads (.netrc se MAPBOX_DOWNLOADS_TOKEN estiver definido)
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            cat <<EOF > ~/.netrc
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
            chmod 600 ~/.netrc
          fi

      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Check signing identities
        script: |
          security find-identity -v -p codesigning

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Set build version
        script: |
          agvtool new-marketing-version 1.0.40
          agvtool new-version -all $((170 + ${PROJECT_BUILD_NUMBER:-1}))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
