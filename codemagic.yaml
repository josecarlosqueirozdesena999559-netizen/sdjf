workflows:
  ios-simulator-build:
    name: iOS Simulator Build (Sem assinatura)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ProjetoRelacionamento.xcodeproj"
        XCODE_SCHEME: "ProjetoRelacionamento"
    scripts:
      - name: Instalar XcodeGen e gerar projeto Xcode
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Compilar para Simulador iOS (iOS 17+)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.log

  ios-release-ipa:
    name: iOS Release & TestFlight (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.template.ProjetoRelacionamento
      xcode: latest
      vars:
        XCODE_PROJECT: "ProjetoRelacionamento.xcodeproj"
        XCODE_SCHEME: "ProjetoRelacionamento"
    scripts:
      - name: Instalar XcodeGen e gerar projeto Xcode
        script: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Configurar perfis de assinatura
        script: |
          xcode-project use-profiles
      - name: Incrementar número de build
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Gerar IPA assinado
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
