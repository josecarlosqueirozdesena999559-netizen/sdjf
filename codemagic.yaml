workflows:
  ios-app-store:
    name: iOS App Store Deployment
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.achou.com
      vars:
        XCODE_PROJECT: "MercadoFacil.xcodeproj"
        XCODE_SCHEME: "MercadoFacil"
      xcode: latest

    scripts:
      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Check signing identities
        script: |
          echo "=== CERTIFICADOS DISPONÍVEIS ==="
          security find-identity -v -p codesigning
          echo "=== CERTIFICADOS IPHONE ==="
          security find-certificate -a -c "Apple Distribution" "$HOME/Library/codemagic-cli-tools/keychains/" || true

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
