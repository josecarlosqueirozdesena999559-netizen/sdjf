workflows:
  ios-app-store:
    name: iOS App Store Deployment
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Codemagic"

    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_PROJECT: "MercadoFacil.xcodeproj"
        XCODE_SCHEME: "MercadoFacil"
        BUNDLE_ID: "com.achou.com"
      xcode: latest

    scripts:

      - name: Generate Xcode Project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Check signing identities
        script: |
          security find-identity -v -p codesigning

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
